[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zoneamento"
version = "0.1.0"
description = "PRJ.15: cadastro e classificação de áreas com GeoPandas (backend Flask)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyogrio>=0.10",
  "pyproj>=3.7",
  "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "PT", "RUF"]
# Símbolos matemáticos (∪, ∩, −, ⊆) são intencionais em docstrings e mensagens, e as
# exceções têm nomes do domínio em português (ErroValidacao, NaoEncontrado).
ignore = ["RUF001", "RUF002", "RUF003", "N818"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["zoneamento"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
